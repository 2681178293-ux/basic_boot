<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VOD 前端直传演示</title>
  <!-- Vue3 + ali-oss，CDN 引入，无需 npm -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.20.0.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .tip { color: #666; font-size: 14px; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 18px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .bar { height: 10px; background: #eee; border-radius: 6px; margin-top: 16px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: #42b983; }
    pre { background: #f6f8fa; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
  </style>
</head>
<body>
<div id="app">
  <h1>阿里云 VOD · 前端直传</h1>
  <p class="tip">流程：向后端要凭证 → 浏览器用 STS 直传 OSS。转码进度看 VOD 回调，不调 complete。</p>

  <label>标题（可选）</label>
  <input type="text" v-model="title" placeholder="不填则用文件名" />

  <label>选择视频</label>
  <input type="file" accept="video/*" @change="onFileChange" />

  <button :disabled="!file || uploading" @click="upload">{{ uploading ? '上传中…' : '开始上传' }}</button>

  <div class="bar"><i :style="{ width: progress + '%' }"></i></div>
  <p>进度：{{ progress }}%</p>
  <pre>{{ logText }}</pre>
</div>

<script>
const { createApp, ref } = Vue

createApp({
  setup() {
    const file = ref(null)
    const title = ref('')
    const uploading = ref(false)
    const progress = ref(0)
    const logText = ref('就绪。启动工程后访问本页：http://localhost:8080/upload.html')

    const log = (msg) => {
      logText.value = (logText.value ? logText.value + '\n' : '') + msg
    }

    const onFileChange = (e) => {
      file.value = e.target.files && e.target.files[0] ? e.target.files[0] : null
      progress.value = 0
    }

    /** Base64 → JSON（UploadAuth / UploadAddress） */
    const decodeB64Json = (b64) => JSON.parse(atob(b64))

    /** 用点播下发的临时凭证构造 ali-oss 客户端 */
    const buildOssClient = (auth, addr) => {
      let endpoint = addr.Endpoint || ''
      endpoint = endpoint.replace(/^https?:\/\//, '')
      return new OSS({
        accessKeyId: auth.AccessKeyId,
        accessKeySecret: auth.AccessKeySecret,
        stsToken: auth.SecurityToken,
        bucket: addr.Bucket,
        endpoint: endpoint,
        secure: true
      })
    }

    const upload = async () => {
      if (!file.value) {
        alert('请先选择视频文件')
        return
      }
      uploading.value = true
      progress.value = 0
      logText.value = ''
      try {
        // 1）向后端要凭证（文件本身还不上传）
        const filename = file.value.name
        const q = new URLSearchParams({
          filename: filename,
          title: title.value || filename
        })
        log('1. 请求凭证 /api/vod/upload/credential ...')
        const credRes = await fetch('/api/vod/upload/credential?' + q.toString())
        if (!credRes.ok) {
          throw new Error('凭证接口失败 HTTP ' + credRes.status + ' ' + await credRes.text())
        }
        const cred = await credRes.json()
        log('2. 拿到 VideoId=' + cred.videoId)

        // 2）解码 Base64，浏览器直传 OSS
        const auth = decodeB64Json(cred.uploadAuth)
        const addr = decodeB64Json(cred.uploadAddress)
        const client = buildOssClient(auth, addr)
        log('3. 开始 multipartUpload → ' + addr.Bucket + '/' + addr.FileName)

        await client.multipartUpload(addr.FileName, file.value, {
          progress: (p) => {
            progress.value = Math.min(100, Math.round(p * 100))
          }
        })
        progress.value = 100
        log('4. OSS 上传完成，VideoId=' + cred.videoId)
        log('无需调 complete；上传/转码进度以点播 HTTP 回调为准，完成后用 GetPlayInfo 取播放地址。')
      } catch (e) {
        console.error(e)
        log('失败：' + (e && e.message ? e.message : e))
        alert('上传失败，请看页面日志。若报 CORS，请给点播存储桶配置跨域。')
      } finally {
        uploading.value = false
      }
    }

    return { file, title, uploading, progress, logText, onFileChange, upload }
  }
}).mount('#app')
</script>
</body>
</html>
