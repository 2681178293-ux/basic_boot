<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>客服一对一 · WebSocket</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #1c1917; }
    a { color: #0f766e; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
    input, select, button { font: inherit; padding: 8px 12px; }
    button { cursor: pointer; background: #0f766e; color: #fff; border: 0; border-radius: 8px; }
    button.secondary { background: #57534e; }
    .chat {
      border: 1px solid #e7e5e4; border-radius: 10px; height: 360px;
      overflow-y: auto; padding: 12px; background: #fffdf9; line-height: 1.7;
    }
    .tip { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.55; }
    .sys { color: #78716c; }
  </style>
</head>
<body>
<p><a href="/">← 返回导航</a></p>
<div id="app">
  <h1>客服一对一</h1>
  <div class="tip">
    开两个窗口：一个选“顾客”，一个选“客服”，都点连接后互发纯文本即可。<br/>
    课堂版只支持 1 个顾客 + 1 个客服，方便对照后端代码。
  </div>

  <div class="row">
    <label>角色
      <select v-model="role" :disabled="connected" @change="onRoleChange">
        <option value="customer">顾客</option>
        <option value="agent">客服</option>
      </select>
    </label>
    <label>昵称 <input v-model.trim="name" :disabled="connected"/></label>
    <button @click="connect">连接</button>
    <button class="secondary" @click="disconnect">断开</button>
  </div>
  <p>状态：{{ connected ? '已连接' : '未连接' }}</p>

  <div class="chat" ref="chatBox">
    <div v-for="(line, i) in lines" :key="i" :class="{ sys: line.startsWith('系统：') }">{{ line }}</div>
  </div>
  <div class="row">
    <input v-model="content" placeholder="输入消息，回车发送" style="flex:1" @keyup.enter="send"/>
    <button @click="send">发送</button>
  </div>
</div>

<script>
Vue.createApp({
  data() {
    return {
      role: 'customer',
      name: '张三',
      content: '',
      connected: false,
      lines: [],
      ws: null
    }
  },
  methods: {
    onRoleChange() {
      if (this.role === 'agent' && (this.name === '张三' || !this.name)) this.name = '客服小王'
      if (this.role === 'customer' && (this.name === '客服小王' || !this.name)) this.name = '张三'
    },
    append(line) {
      this.lines.push(line)
      this.$nextTick(() => {
        const box = this.$refs.chatBox
        if (box) box.scrollTop = box.scrollHeight
      })
    },
    connect() {
      if (this.ws && this.ws.readyState === WebSocket.OPEN) return
      const qs = 'role=' + encodeURIComponent(this.role) + '&name=' + encodeURIComponent(this.name || '匿名')
      const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/cs?' + qs
      this.ws = new WebSocket(url)
      this.ws.onopen = () => { this.connected = true }
      this.ws.onmessage = (e) => this.append(e.data)
      this.ws.onclose = () => {
        this.connected = false
        this.append('系统：连接已关闭')
      }
    },
    send() {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
        alert('请先连接')
        return
      }
      const text = this.content.trim()
      if (!text) return
      this.ws.send(text)
      this.append('我：' + text)
      this.content = ''
    },
    disconnect() {
      if (this.ws) this.ws.close()
    }
  },
  unmounted() {
    if (this.ws) this.ws.close()
  }
}).mount('#app')
</script>
</body>
</html>
