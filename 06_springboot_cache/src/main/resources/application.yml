
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/studb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 10
  cache:
    type: redis
    redis:
      # 未在 RedisCacheManagerBuilderCustomizer 中单独配置的缓存，使用该默认 TTL
      time-to-live: 30m
      cache-null-values: false
mybatis-plus:
  type-aliases-package: net.wanho.po
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

knife4j:
  production: false
  # 启用认证
  enable: true
  # 认证方式和账号密码
  basic:
    enable: true
    username: admin
    password: admin
