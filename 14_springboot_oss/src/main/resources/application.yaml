spring:
  servlet:
    multipart:
      enabled: true
      # 总文件大小
      max-file-size: 10MB
      # 第一个文件大小
      max-request-size: 1MB
      # 解析文件小于1MB在内存，大于1MB超出部分在临时目录
      file-size-threshold: 1MB
      # 解析文件时临时目录
      location: d:/upload/tmp

